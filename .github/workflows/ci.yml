name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    env:
      # Collector tests use the Google Chrome preinstalled on ubuntu runners (Playwright channel "chrome").
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build packages (includes the dashboard)
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Guides format
        run: pnpm docs:check

      - name: Unit and integration tests
        run: pnpm test

      - name: Install Playwright browsers (web package only)
        run: pnpm --filter @perfagent/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm e2e

      - name: Performance budgets
        run: pnpm perf-budget
        env:
          PERFAGENT_BUDGET_SERVER: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-node${{ matrix.node }}
          path: packages/web/playwright-report
          retention-days: 7
