version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      dev-tooling:
        dependency-type: development
        patterns:
          ['eslint*', '@eslint/*', 'typescript*', 'prettier', 'vitest', '@types/*', 'globals']
      playwright:
        patterns: ['playwright*', '@playwright/*']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(ci)'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(docker)'
